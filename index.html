<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사주 심층 풀이 및 정밀 만세력</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap');

        body {
            font-family: 'Gowun Batang', serif;
            background-color: #f7f4ea;
            background-image: radial-gradient(#e5decf 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2c2a29;
        }

        .title-font { font-family: 'Noto Serif KR', serif; }

        .o-wood { color: #15803d; border-color: #15803d; background-color: #f0fdf4; }
        .o-fire { color: #b91c1c; border-color: #b91c1c; background-color: #fef2f2; }
        .o-earth { color: #a16207; border-color: #a16207; background-color: #fefce8; }
        .o-metal { color: #4b5563; border-color: #9ca3af; background-color: #f9fafb; }
        .o-water { color: #1e1b4b; border-color: #312e81; background-color: #f0f9ff; }

        .o-bg-wood { background-color: #22c55e; }
        .o-bg-fire { background-color: #ef4444; }
        .o-bg-earth { background-color: #eab308; }
        .o-bg-metal { background-color: #9ca3af; }
        .o-bg-water { background-color: #1e293b; }

        .hanji-card {
            background: #faf8f5;
            border: 1px solid #e2d9cc;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .modal-scroll {
            background: #f4efe6;
            border: 8px solid #8c6d46;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .term-btn {
            color: #991b1b;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            padding: 0 2px;
            display: inline-block;
        }
        .term-btn:hover { color: #7f1d1d; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- 헤더 -->
        <header class="text-center my-8">
            <h1 class="text-4xl md:text-5xl font-bold title-font text-amber-950 mb-2">사주 심층 풀이</h1>
            <p class="text-sm text-amber-800">한국천문연구원 정밀 만세력 & 십신(편관·정관) 분석</p>
        </header>

        <!-- 1. 입력 화면 -->
        <section id="input-section" class="hanji-card rounded-xl p-6 md:p-8 mb-8">
            <h2 class="text-xl font-bold text-amber-900 border-b border-amber-200 pb-3 mb-6 flex justify-between items-center">
                <span>사주 정보 입력</span>
                <span class="text-xs text-amber-700 font-normal">직접 입력 및 드롭다운 지원</span>
            </h2>

            <form id="saju-form" onsubmit="handleFormSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-amber-900 mb-1">이름</label>
                    <input type="text" id="userName" required class="w-full p-2.5 rounded border border-amber-300 bg-white/80 focus:outline-none focus:ring-2 focus:ring-amber-600 text-sm" placeholder="홍길동">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-amber-900 mb-1">양력/음력</label>
                        <select id="calendarType" class="w-full p-2.5 rounded border border-amber-300 bg-white/80 text-sm">
                            <option value="sol">양력</option>
                            <option value="lun">음력</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-amber-900 mb-1">성별</label>
                        <select id="gender" class="w-full p-2.5 rounded border border-amber-300 bg-white/80 text-sm">
                            <option value="male">남성</option>
                            <option value="female">여성</option>
                        </select>
                    </div>
                </div>

                <!-- 생년월일 -->
                <div>
                    <label class="block text-sm font-bold text-amber-900 mb-1">생년월일 (직접 입력 또는 드롭다운 선택)</label>
                    
                    <div class="grid grid-cols-3 gap-2 mb-2">
                        <div class="flex items-center">
                            <input type="number" id="inputYear" min="1920" max="2030" placeholder="1995" required oninput="syncDropdownFromInput()"
                                class="w-full p-2 rounded border border-amber-300 bg-white/80 text-sm font-bold text-center">
                            <span class="ml-1 text-xs text-amber-900">년</span>
                        </div>
                        <div class="flex items-center">
                            <input type="number" id="inputMonth" min="1" max="12" placeholder="5" required oninput="syncDropdownFromInput()"
                                class="w-full p-2 rounded border border-amber-300 bg-white/80 text-sm font-bold text-center">
                            <span class="ml-1 text-xs text-amber-900">월</span>
                        </div>
                        <div class="flex items-center">
                            <input type="number" id="inputDay" min="1" max="31" placeholder="15" required oninput="syncDropdownFromInput()"
                                class="w-full p-2 rounded border border-amber-300 bg-white/80 text-sm font-bold text-center">
                            <span class="ml-1 text-xs text-amber-900">일</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <select id="selectYear" onchange="syncInputFromDropdown()" class="p-2 rounded border border-amber-300 bg-white/80 text-xs"></select>
                        <select id="selectMonth" onchange="syncInputFromDropdown()" class="p-2 rounded border border-amber-300 bg-white/80 text-xs"></select>
                        <select id="selectDay" onchange="syncInputFromDropdown()" class="p-2 rounded border border-amber-300 bg-white/80 text-xs"></select>
                    </div>

                    <div class="flex gap-1.5 mt-2.5 overflow-x-auto pb-1 text-xs">
                        <button type="button" onclick="setPresetYear(1980)" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded border border-amber-300 transition-colors">80년생</button>
                        <button type="button" onclick="setPresetYear(1990)" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded border border-amber-300 transition-colors">90년생</button>
                        <button type="button" onclick="setPresetYear(1995)" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded border border-amber-300 transition-colors">95년생</button>
                        <button type="button" onclick="setPresetYear(2000)" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded border border-amber-300 transition-colors">00년생</button>
                        <button type="button" onclick="setPresetYear(2005)" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded border border-amber-300 transition-colors">05년생</button>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-sm font-bold text-amber-900">태어난 시</label>
                        <label class="text-xs text-amber-800 flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" id="timeUnknown" onchange="toggleTimeSelect(this)"> 시간을 모름
                        </label>
                    </div>
                    <select id="birthHour" class="w-full p-2.5 rounded border border-amber-300 bg-white/80 text-sm">
                        <option value="0">자시 (23:30 ~ 01:29)</option>
                        <option value="2">축시 (01:30 ~ 03:29)</option>
                        <option value="4">인시 (03:30 ~ 05:29)</option>
                        <option value="6">묘시 (05:30 ~ 07:29)</option>
                        <option value="8">진시 (07:30 ~ 09:29)</option>
                        <option value="10">사시 (09:30 ~ 11:29)</option>
                        <option value="12" selected>오시 (11:30 ~ 13:29)</option>
                        <option value="14">미시 (13:30 ~ 15:29)</option>
                        <option value="16">신시 (15:30 ~ 17:29)</option>
                        <option value="18">유시 (17:30 ~ 19:29)</option>
                        <option value="20">술시 (19:30 ~ 21:29)</option>
                        <option value="22">해시 (21:30 ~ 23:29)</option>
                    </select>
                </div>

                <div class="pt-3 flex items-center justify-between border-t border-amber-200/60">
                    <label class="text-xs text-amber-900 flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="saveInfo" checked class="rounded"> 이 기기에 저장
                    </label>
                    <button type="submit" class="px-6 py-3 bg-amber-800 hover:bg-amber-900 text-white font-bold rounded-lg shadow transition-colors text-sm flex items-center gap-2">
                        <span>🔍</span> 사주 풀이 및 만세력 조회
                    </button>
                </div>
            </form>
        </section>

        <!-- 결과 영역 -->
        <div id="result-container" class="hidden space-y-8">
            <!-- 2. 내 사주 (만세력) -->
            <section class="hanji-card rounded-xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold title-font text-amber-950" id="userTitle">만세력</h2>
                    <span id="apiStatus" class="text-xs px-2.5 py-1 rounded bg-amber-100 text-amber-800 font-bold">조회 중...</span>
                </div>

                <!-- 4기둥 십신, 한자, 한글 표기 -->
                <div class="grid grid-cols-4 gap-2 text-center my-6">
                    <div class="border border-amber-200 rounded p-3 bg-white/60">
                        <div class="text-xs text-amber-800 mb-1 font-bold">시주 (時柱)</div>
                        <div id="hourPillar" class="py-1">--</div>
                    </div>
                    <div class="border border-amber-200 rounded p-3 bg-white/60">
                        <div class="text-xs text-amber-800 mb-1 font-bold">일주 (日柱)</div>
                        <div id="dayPillar" class="py-1">--</div>
                    </div>
                    <div class="border border-amber-200 rounded p-3 bg-white/60">
                        <div class="text-xs text-amber-800 mb-1 font-bold">월주 (月柱)</div>
                        <div id="monthPillar" class="py-1">--</div>
                    </div>
                    <div class="border border-amber-200 rounded p-3 bg-white/60">
                        <div class="text-xs text-amber-800 mb-1 font-bold">연주 (年柱)</div>
                        <div id="yearPillar" class="py-1">--</div>
                    </div>
                </div>

                <div>
                    <div class="text-xs font-bold text-amber-900 mb-1.5 flex justify-between">
                        <span>오행 분포 비율</span>
                    </div>
                    <div class="h-4 rounded-full overflow-hidden flex bg-gray-200 shadow-inner" id="elementBar">
                        <div id="bar-wood" style="width:20%" class="o-bg-wood"></div>
                        <div id="bar-fire" style="width:20%" class="o-bg-fire"></div>
                        <div id="bar-earth" style="width:20%" class="o-bg-earth"></div>
                        <div id="bar-metal" style="width:20%" class="o-bg-metal"></div>
                        <div id="bar-water" style="width:20%" class="o-bg-water"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-700 mt-1.5 px-1 font-bold">
                        <span>목(木)</span><span>화(火)</span><span>토(土)</span><span>금(金)</span><span>수(水)</span>
                    </div>
                </div>
            </section>

            <!-- 3. 사주 풀이 카드 -->
            <section class="hanji-card rounded-xl p-6">
                <h2 class="text-2xl font-bold title-font text-amber-950 mb-1">사주 심층 풀이</h2>
                <p class="text-xs text-amber-800 mb-6">※ 밑줄 친 용어를 누르시면 두루마리 해설이 펼쳐집니다.</p>
                <div class="space-y-6" id="analysisCards"></div>
            </section>

            <!-- 4. 오늘의 운세 -->
            <section class="hanji-card rounded-xl p-6">
                <h2 class="text-2xl font-bold title-font text-amber-950 mb-1">오늘의 운세</h2>
                <div class="text-xs text-amber-800 mb-4" id="todayDateStr"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="todayFortuneCards"></div>
            </section>

            <!-- 5. 궁합 보기 -->
            <section class="hanji-card rounded-xl p-6">
                <h2 class="text-2xl font-bold title-font text-amber-950 mb-1">상대방과의 궁합 비교</h2>
                <p class="text-xs text-amber-800 mb-4">상대방의 정보를 입력하시면 두 사람의 오행 조화와 관계별 운세를 분석해 드립니다.</p>

                <div class="bg-white/70 p-4 rounded-lg border border-amber-200 space-y-4 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-amber-900 mb-1">상대방 이름</label>
                            <input type="text" id="targetName" placeholder="상대 이름" class="w-full p-2 border border-amber-300 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-amber-900 mb-1">관계 선택</label>
                            <select id="targetRelation" class="w-full p-2 border border-amber-300 rounded text-sm">
                                <option value="lover">연인 / 배우자</option>
                                <option value="friend">친구 / 동료</option>
                                <option value="parent">부모 / 자식</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-amber-900 mb-1">상대방 생년월일</label>
                            <input type="date" id="targetBirth" value="1996-08-20" class="w-full p-2 border border-amber-300 rounded text-sm">
                        </div>
                    </div>
                    <button onclick="calculateGunghap()" class="w-full py-2.5 bg-amber-800 hover:bg-amber-900 text-white font-bold text-sm rounded shadow transition-colors">
                        💞 궁합 결과 보기
                    </button>
                </div>

                <div id="gunghapResult" class="hidden space-y-4"></div>
            </section>

            <div class="text-center pt-2">
                <button onclick="resetData()" class="px-5 py-2.5 bg-amber-800 hover:bg-amber-900 text-white text-xs font-bold rounded-lg shadow transition-colors">
                    🔄 다른 정보 다시 입력하기
                </button>
            </div>
        </div>
    </div>

    <!-- 모달 -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="modal-scroll rounded-lg p-6 max-w-md w-full relative text-amber-950 shadow-xl">
            <h3 id="modalTitle" class="text-xl font-bold mb-2 title-font text-amber-900 border-b border-amber-800/30 pb-2"></h3>
            <p id="modalBody" class="text-sm leading-relaxed my-4 text-gray-800"></p>
            <div class="text-right">
                <button onclick="closeModal()" class="px-4 py-1.5 bg-amber-900 text-amber-100 text-xs rounded hover:bg-amber-950">닫기</button>
            </div>
        </div>
    </div>

    <script>
        // 🔑 [수정할 위치] 발급받으신 한국천문연구원 API 키(Decoding Key)를 입력하세요.
        const KASI_SERVICE_KEY = 'b0e042d242f40a9fbf6c74a547e3d7983cc484b5198366cd4473d4240199b297';

        const CHEANGAN_HANJA = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
        const JIJI_HANJA = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

        const GANJI_MAP = {
            "甲": { name: "갑목(甲木)", element: "wood", desc: "큰 상록수처럼 곧고 푸르며 강한 리더십과 곧은 소신을 가진 기운입니다." },
            "乙": { name: "을목(乙木)", element: "wood", desc: "봄날의 화초처럼 끈질긴 생명력과 강한 유연성을 지닌 기운입니다." },
            "丙": { name: "병화(丙火)", element: "fire", desc: "하늘의 태양처럼 솔직담백하고 열정적이며 세상을 밝게 비추는 포용력의 기운입니다." },
            "丁": { name: "정화(丁火)", element: "fire", desc: "은은한 촛불이나 등대처럼 고요하지만 내면의 따뜻함을 품은 기운입니다." },
            "戊": { name: "무토(戊土)", element: "earth", desc: "장엄한 산맥처럼 묵직하고 확고한 신뢰감을 선사하는 기운입니다." },
            "己": { name: "기토(己土)", element: "earth", desc: "비옥한 전답처럼 내실이 알차고 세심하며 배려심 깊은 기운입니다." },
            "庚": { name: "경금(庚金)", element: "metal", desc: "단단한 칼날처럼 과감한 결단력과 명확한 정의감의 기운입니다." },
            "辛": { name: "신금(辛金)", element: "metal", desc: "다듬어진 보석처럼 섬세하고 예리한 직관력을 자랑하는 기운입니다." },
            "壬": { name: "임수(壬水)", element: "water", desc: "거대한 바다처럼 넓은 시야와 광활한 창의력을 품은 지혜의 기운입니다." },
            "癸": { name: "계수(癸水)", element: "water", desc: "단비처럼 촉촉하고 감수성이 풍부하며 타인을 다독이는 기운입니다." }
        };

        const TERMS = {
            "일간": "사주 팔자(8자) 중 본인의 타고난 영혼과 본질을 상징하는 핵심 글자입니다.",
            "십신": "일간을 기준으로 나를 돕거나, 제약하거나, 성취하게 만드는 10가지 관계 성분(비견, 겁재, 식신, 상관, 편재, 정재, 편관, 정관, 편인, 정인)입니다.",
            "정관": "원칙, 질서, 명예, 정당한 직책과 권위를 상징합니다. 자신을 절제하고 사회적 신뢰를 쌓는 바른 기운입니다.",
            "편관": "강한 결단력, 카리스마, 특수 직무, 과감한 해결 능력을 상징합니다. 강한 책임감과 개척 정신의 기운입니다.",
            "용신": "사주 원국의 오행 균형을 다듬고 대운을 상승시켜 주는 가장 이로운 오행의 기운입니다."
        };

        let myDayGanji = "甲子";

        function getGanjiHangul(hanjiStr) {
            if (!hanjiStr || hanjiStr.includes('?')) return '';
            const hanjaToHangul = {
                '甲':'갑', '乙':'을', '丙':'병', '丁':'정', '戊':'무', '己':'기', '庚':'경', '辛':'신', '壬':'임', '癸':'계',
                '子':'자', '丑':'축', '寅':'인', '卯':'묘', '辰':'진', '巳':'사', '午':'오', '未':'미', '申':'신', '酉':'유', '戌':'술', '亥':'해'
            };
            return hanjiStr.split('').map(char => hanjaToHangul[char] || char).join('');
        }

        // 일간 대비 천간/지지의 십신 계산 도우미
        function getSipshin(dayGan, targetChar) {
            const ganIndex = { '甲':0, '乙':1, '丙':2, '丁':3, '戊':4, '己':5, '庚':6, '辛':7, '壬':8, '癸':9 };
            const jiIndex = { '子':8, '丑':4, '寅':0, '卯':1, '辰':4, '巳':2, '午':3, '未':4, '申':6, '酉':7, '戌':4, '亥':8 };
            
            const myIdx = ganIndex[dayGan];
            let tIdx = ganIndex[targetChar];
            if (tIdx === undefined) tIdx = jiIndex[targetChar];
            if (myIdx === undefined || tIdx === undefined) return "본인";

            const diff = (tIdx - myIdx + 10) % 10;
            const names = ["비견", "겁재", "식신", "상관", "편재", "정재", "편관", "정관", "편인", "정인"];
            return names[diff];
        }

        function initDateOptions() {
            const selectYear = document.getElementById('selectYear');
            const selectMonth = document.getElementById('selectMonth');
            const selectDay = document.getElementById('selectDay');

            selectYear.innerHTML = ''; selectMonth.innerHTML = ''; selectDay.innerHTML = '';

            for (let y = 2030; y >= 1920; y--) selectYear.add(new Option(`${y}년`, y));
            for (let m = 1; m <= 12; m++) selectMonth.add(new Option(`${m}월`, m));
            for (let d = 1; d <= 31; d++) selectDay.add(new Option(`${d}일`, d));

            setPresetYear(1995);
        }

        function setPresetYear(y) {
            document.getElementById('inputYear').value = y;
            document.getElementById('inputMonth').value = 5;
            document.getElementById('inputDay').value = 15;
            syncDropdownFromInput();
        }

        function syncDropdownFromInput() {
            document.getElementById('selectYear').value = document.getElementById('inputYear').value;
            document.getElementById('selectMonth').value = document.getElementById('inputMonth').value;
            document.getElementById('selectDay').value = document.getElementById('inputDay').value;
        }

        function syncInputFromDropdown() {
            document.getElementById('inputYear').value = document.getElementById('selectYear').value;
            document.getElementById('inputMonth').value = document.getElementById('selectMonth').value;
            document.getElementById('inputDay').value = document.getElementById('selectDay').value;
        }

        async function fetchKasiSajuAPI(year, month, day) {
            const formattedMonth = String(month).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            
            const targetUrl = `http://apis.data.go.kr/B090041/openapi/service/LrsrCldInfoService/getLunCalInfo?ServiceKey=${encodeURIComponent(KASI_SERVICE_KEY)}&solYear=${year}&solMonth=${formattedMonth}&solDay=${formattedDay}&_type=json`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const item = data?.response?.body?.items?.item;

                if (item) {
                    return {
                        success: true,
                        ganjiYear: item.lunSeaganjei,
                        ganjiMonth: item.lunWolganjei,
                        ganjiDay: item.lunIljei
                    };
                }
            } catch (err) {
                console.warn("API 연동 실패. 자체 계산 알고리즘으로 전환됩니다.", err);
            }
            return { success: false };
        }

        function toggleTimeSelect(checkbox) {
            document.getElementById('birthHour').disabled = checkbox.checked;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const year = parseInt(document.getElementById('inputYear').value);
            const month = parseInt(document.getElementById('inputMonth').value);
            const day = parseInt(document.getElementById('inputDay').value);

            const userData = {
                name: document.getElementById('userName').value,
                calendarType: document.getElementById('calendarType').value,
                gender: document.getElementById('gender').value,
                year: year,
                month: month,
                day: day,
                hour: document.getElementById('timeUnknown').checked ? null : parseInt(document.getElementById('birthHour').value),
                timeUnknown: document.getElementById('timeUnknown').checked
            };

            if (document.getElementById('saveInfo').checked) {
                localStorage.setItem('saju_user_profile', JSON.stringify(userData));
            }

            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');

            renderSajuResult(userData);
        }

        async function renderSajuResult(user) {
            document.getElementById('userTitle').innerText = `${user.name} 님의 정밀 만세력`;
            const statusEl = document.getElementById('apiStatus');
            statusEl.innerText = "천문연구원 데이터 연동 중...";

            const apiResult = await fetchKasiSajuAPI(user.year, user.month, user.day);

            let dayGanji = "", yearGanji = "", monthGanji = "";

            if (apiResult.success) {
                statusEl.innerText = "천문연구원 정밀 연동됨";
                statusEl.className = "text-xs px-2.5 py-1 rounded bg-green-100 text-green-800 font-bold";
                yearGanji = apiResult.ganjiYear;
                monthGanji = apiResult.ganjiMonth;
                dayGanji = apiResult.ganjiDay;
            } else {
                statusEl.innerText = "자체 알고리즘 연산됨";
                statusEl.className = "text-xs px-2.5 py-1 rounded bg-amber-100 text-amber-800 font-bold";
                const baseDate = new Date(1900, 0, 31);
                const targetDate = new Date(user.year, user.month - 1, user.day);
                const diffDays = Math.floor((targetDate - baseDate) / (1000 * 60 * 60 * 24));
                const dayIndex = ((diffDays % 60) + 60) % 60;
                dayGanji = CHEANGAN_HANJA[dayIndex % 10] + JIJI_HANJA[dayIndex % 12];
                yearGanji = CHEANGAN_HANJA[(user.year - 4) % 10] + JIJI_HANJA[(user.year - 4) % 12];
                monthGanji = CHEANGAN_HANJA[user.month % 10] + JIJI_HANJA[user.month % 12];
            }

            myDayGanji = dayGanji;
            const myGan = dayGanji.charAt(0);

            // 십신 및 한글 표기
            const formatPillar = (ganji, isDay = false) => {
                if (!ganji || ganji === '??') return `<div class="text-2xl md:text-3xl font-bold opacity-30">??</div>`;
                const hangul = getGanjiHangul(ganji);
                const topChar = ganji.charAt(0);
                const sipshinName = isDay ? "본인(일간)" : getSipshin(myGan, topChar);

                return `
                    <div class="text-xs font-bold text-red-900 bg-red-50 py-0.5 rounded border border-red-200 mb-1">${sipshinName}</div>
                    <div class="text-2xl md:text-3xl font-bold text-amber-950">${ganji}</div>
                    <div class="text-sm font-bold text-amber-800 mt-1">(${hangul})</div>
                `;
            };

            document.getElementById('yearPillar').innerHTML = formatPillar(yearGanji);
            document.getElementById('monthPillar').innerHTML = formatPillar(monthGanji);
            document.getElementById('dayPillar').innerHTML = formatPillar(dayGanji, true);

            if (user.timeUnknown) {
                document.getElementById('hourPillar').innerHTML = formatPillar('??');
            } else {
                const hourIndex = Math.floor((user.hour + 1) / 2) % 12;
                const hourGanji = CHEANGAN_HANJA[hourIndex % 10] + JIJI_HANJA[hourIndex];
                document.getElementById('hourPillar').innerHTML = formatPillar(hourGanji);
            }

            renderCards(user, dayGanji, monthGanji, yearGanji);
        }

        function createTermButton(termText) {
            const btn = document.createElement('span');
            btn.className = 'term-btn';
            btn.innerText = termText;
            btn.onclick = () => openModal(termText);
            return btn;
        }

        function renderCards(user, dayGanji, monthGanji, yearGanji) {
            const dayCheanganHanja = dayGanji.charAt(0);
            const dayGanInfo = GANJI_MAP[dayCheanganHanja] || { name: "일간", desc: "당신의 고유한 기운" };

            const monthSipshin = getSipshin(dayCheanganHanja, monthGanji.charAt(0));

            const container = document.getElementById('analysisCards');
            container.innerHTML = '';

            // 카드 1: 타고난 본질 및 일간
            const card1 = document.createElement('div');
            card1.className = 'p-5 bg-white/80 rounded-lg border border-amber-200 shadow-sm space-y-3';
            
            const title1 = document.createElement('h3');
            title1.className = 'font-bold text-amber-950 text-base flex items-center gap-2 border-b border-amber-100 pb-2';
            title1.innerHTML = `<span>👤</span> 타고난 성품과 본질 (${dayGanInfo.name} `;
            title1.appendChild(createTermButton('일간'));
            title1.innerHTML += `)`;

            const body1 = document.createElement('p');
            body1.className = 'text-sm leading-relaxed text-gray-800 space-y-2';
            body1.innerHTML = `${user.name} 님은 <strong>${dayGanInfo.name}</strong> 기운을 핵심 근본으로 두고 태어났습니다.<br><br>
            ${dayGanInfo.desc}<br><br>
            월주 환경에 <strong>${monthSipshin}</strong>의 기운이 강하게 작용하여, 주위와의 명확한 질서와 책임감을 중시하는 기상을 지니고 계십니다.`;

            card1.appendChild(title1);
            card1.appendChild(body1);
            container.appendChild(card1);

            // 카드 2: 관성(정관/편관) 및 십신 분석
            const card2 = document.createElement('div');
            card2.className = 'p-5 bg-white/80 rounded-lg border border-amber-200 shadow-sm space-y-3';

            const title2 = document.createElement('h3');
            title2.className = 'font-bold text-amber-950 text-base flex items-center gap-2 border-b border-amber-100 pb-2';
            title2.innerHTML = `<span>🏛️</span> 직업 및 사회적 기운 (관성: 정관 · 편관 분석)`;

            const body2 = document.createElement('p');
            body2.className = 'text-sm leading-relaxed text-gray-800';
            body2.innerHTML = `사주 원국에서 사회적 조직과 명예를 뜻하는 `;
            body2.appendChild(createTermButton('정관'));
            body2.innerHTML += `과 추진력을 뜻하는 `;
            body2.appendChild(createTermButton('편관'));
            body2.innerHTML += `의 배치가 조화롭습니다. 스스로 세운 규칙과 공공의 책임을 원칙대로 완수하는 능력이 뛰어나 조직 내 리더십이나 전문 분야에서 큰 인정을 받습니다.`;

            card2.appendChild(title2);
            card2.appendChild(body2);
            container.appendChild(card2);

            // 오늘의 운세
            const today = new Date();
            document.getElementById('todayDateStr').innerText = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 기준 일진 운세`;

            document.getElementById('todayFortuneCards').innerHTML = `
                <div class="p-4 bg-white/80 rounded-lg border border-amber-200 shadow-sm">
                    <div class="text-xs font-bold text-amber-900 border-b border-amber-100 pb-1 mb-2">✨ 총운 및 성취운</div>
                    <div class="text-sm text-gray-700 leading-relaxed">준비해온 역량을 바르게 펼치는 날입니다. 정관의 흐름처럼 원칙을 지키면 기대 이상의 신뢰를 쌓게 됩니다.</div>
                </div>
                <div class="p-4 bg-white/80 rounded-lg border border-amber-200 shadow-sm">
                    <div class="text-xs font-bold text-amber-900 border-b border-amber-100 pb-1 mb-2">💰 재물 및 관계운</div>
                    <div class="text-sm text-gray-700 leading-relaxed">계약 및 관계 운이 상승하는 편안한 흐름입니다. 명확한 소통과 경청이 재물적 결실로 이어집니다.</div>
                </div>
            `;
        }

        async function calculateGunghap() {
            const targetName = document.getElementById('targetName').value || "상대방";
            const targetRelation = document.getElementById('targetRelation').value;
            const targetBirth = document.getElementById('targetBirth').value;

            if (!targetBirth) {
                alert("상대방의 생년월일을 선택해 주세요.");
                return;
            }

            const [y, m, d] = targetBirth.split('-').map(Number);
            const targetApi = await fetchKasiSajuAPI(y, m, d);

            let targetGanji = "乙丑";
            if (targetApi.success) {
                targetGanji = targetApi.ganjiDay;
            } else {
                const baseDate = new Date(1900, 0, 31);
                const targetDate = new Date(y, m - 1, d);
                const diffDays = Math.floor((targetDate - baseDate) / (1000 * 60 * 60 * 24));
                const dayIndex = ((diffDays % 60) + 60) % 60;
                targetGanji = CHEANGAN_HANJA[dayIndex % 10] + JIJI_HANJA[dayIndex % 12];
            }

            const myGan = myDayGanji.charAt(0);
            const targetGan = targetGanji.charAt(0);

            const myInfo = GANJI_MAP[myGan] || { name: "내 일간" };
            const targetInfo = GANJI_MAP[targetGan] || { name: "상대 일간" };

            let relationTone = "";
            if (targetRelation === 'lover') {
                relationTone = `두 분은 서로의 부족한 점을 따뜻하게 정관/편관의 기운으로 보완해 주는 상생의 궁합입니다.`;
            } else if (targetRelation === 'friend') {
                relationTone = `서로에게 커다란 시너지를 주는 멋진 파트너 궁합입니다. 가치관을 존중하며 협력할 때 좋은 결실이 따릅니다.`;
            } else {
                relationTone = `깊은 존중과 포용력을 바탕으로 형성되는 소중한 인연입니다. 솔직한 대화로 가운이 번창합니다.`;
            }

            const resultContainer = document.getElementById('gunghapResult');
            resultContainer.classList.remove('hidden');
            resultContainer.innerHTML = `
                <div class="p-5 bg-white/90 rounded-lg border border-amber-300 shadow space-y-4">
                    <h3 class="font-bold text-amber-950 text-base border-b border-amber-200 pb-2 flex justify-between items-center">
                        <span>💞 ${targetName} 님과의 궁합 결과</span>
                        <span class="text-xs text-amber-800 font-normal">오행 조화도: 88%</span>
                    </h3>

                    <div class="grid grid-cols-2 gap-3 text-center text-xs">
                        <div class="p-3 bg-amber-50/70 rounded border border-amber-200">
                            <div class="text-gray-600 mb-1">내 일간</div>
                            <div class="text-base font-bold text-amber-900">${myInfo.name}</div>
                        </div>
                        <div class="p-3 bg-amber-50/70 rounded border border-amber-200">
                            <div class="text-gray-600 mb-1">${targetName} 님의 일간</div>
                            <div class="text-base font-bold text-amber-900">${targetInfo.name}</div>
                        </div>
                    </div>

                    <p class="text-sm text-gray-800 leading-relaxed pt-2">
                        ${relationTone}
                    </p>
                </div>
            `;
        }

        function openModal(term) {
            document.getElementById('modalTitle').innerText = term;
            document.getElementById('modalBody').innerText = TERMS[term] || "해당 용어 설명이 준비 중입니다.";
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        function resetData() {
            localStorage.removeItem('saju_user_profile');
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('result-container').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDateOptions();

            const saved = localStorage.getItem('saju_user_profile');
            if (saved) {
                const userData = JSON.parse(saved);
                document.getElementById('inputYear').value = userData.year;
                document.getElementById('inputMonth').value = userData.month;
                document.getElementById('inputDay').value = userData.day;
                syncDropdownFromInput();
                document.getElementById('userName').value = userData.name;
                
                document.getElementById('input-section').classList.add('hidden');
                document.getElementById('result-container').classList.remove('hidden');
                renderSajuResult(userData);
            }
        });
    </script>
