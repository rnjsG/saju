<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사주 심층 풀이 및 정밀 만세력</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap');

        body {
            font-family: 'Gowun Batang', serif;
            background-color: #f7f4ea;
            background-image: radial-gradient(#e5decf 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2c2a29;
        }

        .title-font {
            font-family: 'Noto Serif KR', serif;
        }

        /* 오행 색상 스타일 */
        .o-wood { color: #15803d; border-color: #15803d; background-color: #f0fdf4; }
        .o-fire { color: #b91c1c; border-color: #b91c1c; background-color: #fef2f2; }
        .o-earth { color: #a16207; border-color: #a16207; background-color: #fefce8; }
        .o-metal { color: #4b5563; border-color: #9ca3af; background-color: #f9fafb; }
        .o-water { color: #1e1b4b; border-color: #312e81; background-color: #f0f9ff; }

        .o-bg-wood { background-color: #22c55e; }
        .o-bg-fire { background-color: #ef4444; }
        .o-bg-earth { background-color: #eab308; }
        .o-bg-metal { background-color: #9ca3af; }
        .o-bg-water { background-color: #1e293b; }

        .hanji-card {
            background: #faf8f5;
            border: 1px solid #e2d9cc;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .modal-scroll {
            background: #f4efe6;
            border: 8px solid #8c6d46;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .term-btn {
            color: #991b1b;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            padding: 0 2px;
        }
        .term-btn:hover {
            color: #7f1d1d;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- 헤더 -->
        <header class="text-center my-8">
            <h1 class="text-4xl md:text-5xl font-bold title-font text-amber-950 mb-2">사주 심층 풀이</h1>
            <p class="text-sm text-amber-800">한국천문연구원 정밀 데이터 기반 만세력</p>
        </header>

        <!-- 1. 입력 화면 -->
        <section id="input-section" class="hanji-card rounded-xl p-6 md:p-8 mb-8">
            <h2 class="text-xl font-bold text-amber-900 border-b border-amber-200 pb-3 mb-6">사주 정보 입력</h2>
            <form id="saju-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-amber-900 mb-1">이름</label>
                    <input type="text" id="userName" required class="w-full p-2.5 rounded border border-amber-300 bg-white/80 focus:outline-none focus:ring-2 focus:ring-amber-600" placeholder="홍길동">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-amber-900 mb-1">양력/음력</label>
                        <select id="calendarType" class="w-full p-2.5 rounded border border-amber-300 bg-white/80 focus:outline-none focus:ring-2 focus:ring-amber-600">
                            <option value="sol">양력</option>
                            <option value="lun">음력</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-amber-900 mb-1">성별</label>
                        <select id="gender" class="w-full p-2.5 rounded border border-amber-300 bg-white/80 focus:outline-none focus:ring-2 focus:ring-amber-600">
                            <option value="male">남성</option>
                            <option value="female">여성</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-amber-900 mb-1">생년월일 선택</label>
                    <input type="date" id="birthDate" required value="1995-05-15" class="w-full p-2.5 rounded border border-amber-300 bg-white/80 focus:outline-none focus:ring-2 focus:ring-amber-600">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-sm font-bold text-amber-900">태어난 시</label>
                        <label class="text-xs text-amber-800 flex items-center gap-1 cursor-pointer">
                            <input type="checkbox" id="timeUnknown" onchange="toggleTimeSelect(this)"> 시간을 모름
                        </label>
                    </div>
                    <select id="birthHour" class="w-full p-2.5 rounded border border-amber-300 bg-white/80">
                        <option value="0">자시 (23:30 ~ 01:29)</option>
                        <option value="2">축시 (01:30 ~ 03:29)</option>
                        <option value="4">인시 (03:30 ~ 05:29)</option>
                        <option value="6">묘시 (05:30 ~ 07:29)</option>
                        <option value="8">진시 (07:30 ~ 09:29)</option>
                        <option value="10">사시 (09:30 ~ 11:29)</option>
                        <option value="12" selected>오시 (11:30 ~ 13:29)</option>
                        <option value="14">미시 (13:30 ~ 15:29)</option>
                        <option value="16">신시 (15:30 ~ 17:29)</option>
                        <option value="18">유시 (17:30 ~ 19:29)</option>
                        <option value="20">술시 (19:30 ~ 21:29)</option>
                        <option value="22">해시 (21:30 ~ 23:29)</option>
                    </select>
                </div>

                <div class="pt-2 flex items-center justify-between">
                    <label class="text-sm text-amber-900 flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="saveInfo" checked> 내 정보 이 기기에 저장
                    </label>
                    <button type="submit" class="px-6 py-3 bg-amber-800 hover:bg-amber-900 text-white font-bold rounded-lg shadow transition-colors">
                        사주 보기
                    </button>
                </div>
            </form>
        </section>

        <!-- 결과 영역 -->
        <div id="result-container" class="hidden space-y-8">
            <!-- 2. 내 사주 (만세력) -->
            <section class="hanji-card rounded-xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold title-font text-amber-950" id="userTitle">만세력</h2>
                    <span id="apiStatus" class="text-xs px-2 py-1 rounded bg-amber-100 text-amber-800">조회 중...</span>
                </div>

                <!-- 4기둥 세로 한자 -->
                <div class="grid grid-cols-4 gap-2 text-center my-6">
                    <div class="border border-amber-200 rounded p-3 bg-white/50">
                        <div class="text-xs text-amber-700 mb-1">시주 (時柱)</div>
                        <div id="hourPillar" class="text-2xl md:text-3xl font-bold py-2">--</div>
                    </div>
                    <div class="border border-amber-200 rounded p-3 bg-white/50">
                        <div class="text-xs text-amber-700 mb-1">일주 (日柱)</div>
                        <div id="dayPillar" class="text-2xl md:text-3xl font-bold py-2">--</div>
                    </div>
                    <div class="border border-amber-200 rounded p-3 bg-white/50">
                        <div class="text-xs text-amber-700 mb-1">월주 (月柱)</div>
                        <div id="monthPillar" class="text-2xl md:text-3xl font-bold py-2">--</div>
                    </div>
                    <div class="border border-amber-200 rounded p-3 bg-white/50">
                        <div class="text-xs text-amber-700 mb-1">연주 (年柱)</div>
                        <div id="yearPillar" class="text-2xl md:text-3xl font-bold py-2">--</div>
                    </div>
                </div>

                <!-- 오행 분포 막대 -->
                <div>
                    <div class="text-xs font-bold text-amber-900 mb-1">오행 분포 비율</div>
                    <div class="h-4 rounded-full overflow-hidden flex bg-gray-200" id="elementBar">
                        <div id="bar-wood" style="width:20%" class="o-bg-wood"></div>
                        <div id="bar-fire" style="width:20%" class="o-bg-fire"></div>
                        <div id="bar-earth" style="width:20%" class="o-bg-earth"></div>
                        <div id="bar-metal" style="width:20%" class="o-bg-metal"></div>
                        <div id="bar-water" style="width:20%" class="o-bg-water"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-600 mt-1 px-1">
                        <span>목(木)</span><span>화(火)</span><span>토(土)</span><span>금(金)</span><span>수(水)</span>
                    </div>
                </div>
            </section>

            <!-- 3. 사주 풀이 카드 -->
            <section class="hanji-card rounded-xl p-6">
                <h2 class="text-2xl font-bold title-font text-amber-950 mb-1">사주 심층 풀이</h2>
                <p class="text-xs text-amber-800 mb-6">※ 강조된 전문 용어를 누르시면 두루마리 해설이 펼쳐집니다.</p>

                <div class="space-y-6" id="analysisCards">
                    <!-- 풀이 카드가 Dynamic하게 생성됨 -->
                </div>
            </section>

            <!-- 4. 오늘의 운세 -->
            <section class="hanji-card rounded-xl p-6">
                <h2 class="text-2xl font-bold title-font text-amber-950 mb-1">오늘의 운세</h2>
                <div class="text-xs text-amber-800 mb-4" id="todayDateStr"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="todayFortuneCards">
                    <!-- 운세 카드 목록 -->
                </div>
            </section>

            <div class="text-center pt-2">
                <button onclick="resetData()" class="px-4 py-2 bg-amber-200 hover:bg-amber-300 text-amber-900 text-xs font-bold rounded transition-colors">
                    🔄 다른 생년월일 입력하기
                </button>
            </div>
        </div>
    </div>

    <!-- 용어 설명 모달 (두루마리) -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="modal-scroll rounded-lg p-6 max-w-md w-full relative text-amber-950">
            <h3 id="modalTitle" class="text-xl font-bold mb-2 title-font text-amber-900 border-b border-amber-800/30 pb-2"></h3>
            <p id="modalBody" class="text-sm leading-relaxed my-4"></p>
            <div class="text-right">
                <button onclick="closeModal()" class="px-4 py-1.5 bg-amber-900 text-amber-100 text-xs rounded hover:bg-amber-950">닫기</button>
            </div>
        </div>
    </div>

    <script>
        // 🔑 [수정할 위치] 발급받으신 한국천문연구원 API 키(Decoding Key)를 입력하세요.
        const KASI_SERVICE_KEY = 'b0e042d242f40a9fbf6c74a547e3d7983cc484b5198366cd4473d4240199b297';

        const CHEANGAN = ["갑", "을", "병", "정", "무", "기", "경", "신", "임", "계"];
        const CHEANGAN_HANJA = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
        const CHEANGAN_ELEMENT = ["wood", "wood", "fire", "fire", "earth", "earth", "metal", "metal", "water", "water"];

        const JIJI = ["자", "축", "인", "묘", "진", "사", "오", "미", "신", "유", "술", "해"];
        const JIJI_HANJA = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

        const GANJI_MAP = {
            "甲": { name: "갑", element: "wood", desc: "큰 나무처럼 곧고 추진력이 강하며 리더십이 뛰어난 기운" },
            "乙": { name: "을", element: "wood", desc: "화초처럼 유연하고 유연한 적응력과 강인한 생명력을 지닌 기운" },
            "丙": { name: "병", element: "fire", desc: "태양처럼 열정적이고 열린 마음과 표현력이 풍부한 기운" },
            "丁": { name: "정", element: "fire", desc: "촛불처럼 은은하고 섬세하며 내면의 온기를 품은 기운" },
            "戊": { name: "무", element: "earth", desc: "광활한 산처럼 묵직하고 포용력과 신뢰감을 주는 기운" },
            "己": { name: "기", element: "earth", desc: "비옥한 옥토처럼 실속이 있고 세심하게 다듬어진 기운" },
            "庚": { name: "경", element: "metal", desc: "원석/단단한 칼날처럼 결단력이 있고 정의감이 강한 기운" },
            "辛": { name: "신", element: "metal", desc: "보석처럼 예리하고 섬세하며 완벽주의 성향을 지닌 기운" },
            "壬": { name: "임", element: "water", desc: "넓은 바다처럼 지혜롭고 거침없는 아이디어를 품은 기운" },
            "癸": { name: "계", element: "water", desc: "단비처럼 촉촉하고 감수성이 뛰어나며 직관력이 높은 기운" }
        };

        const TERMS = {
            "일간": "사주 8자 중 본인을 나타내는 가장 핵심이 되는 글자입니다. 나의 성격, 본질, 기본 태도를 상징합니다.",
            "십신": "일간을 기준으로 다른 글자들과의 관계를 10가지 신(비견, 겁재, 식신, 상관, 편재, 정재, 편관, 정관, 편인, 정인)으로 분류한 명리학 개념입니다.",
            "용신": "사주 전체의 불균형을 조화롭게 맞춰주는 가장 중요한 오행의 기운입니다."
        };

        async function fetchKasiSajuAPI(year, month, day) {
            const formattedMonth = String(month).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            
            const targetUrl = `http://apis.data.go.kr/B090041/openapi/service/LrsrCldInfoService/getLunCalInfo?ServiceKey=${encodeURIComponent(KASI_SERVICE_KEY)}&solYear=${year}&solMonth=${formattedMonth}&solDay=${formattedDay}&_type=json`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const item = data?.response?.body?.items?.item;

                if (item) {
                    return {
                        success: true,
                        ganjiYear: item.lunSeaganjei,
                        ganjiMonth: item.lunWolganjei,
                        ganjiDay: item.lunIljei
                    };
                }
            } catch (err) {
                console.warn("API 연동 실패, 자체 계산으로 전환됩니다.", err);
            }
            return { success: false };
        }

        function toggleTimeSelect(checkbox) {
            document.getElementById('birthHour').disabled = checkbox.checked;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const dateVal = document.getElementById('birthDate').value;
            const [year, month, day] = dateVal.split('-').map(Number);

            const userData = {
                name: document.getElementById('userName').value,
                calendarType: document.getElementById('calendarType').value,
                gender: document.getElementById('gender').value,
                year: year,
                month: month,
                day: day,
                hour: document.getElementById('timeUnknown').checked ? null : parseInt(document.getElementById('birthHour').value),
                timeUnknown: document.getElementById('timeUnknown').checked
            };

            if (document.getElementById('saveInfo').checked) {
                localStorage.setItem('saju_user_profile', JSON.stringify(userData));
            }

            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');

            renderSajuResult(userData);
        }

        async function renderSajuResult(user) {
            document.getElementById('userTitle').innerText = `${user.name} 님의 만세력`;
            const statusEl = document.getElementById('apiStatus');
            statusEl.innerText = "천문연구원 데이터 조회 중...";

            const apiResult = await fetchKasiSajuAPI(user.year, user.month, user.day);

            let dayGanji = "";
            let yearGanji = "";
            let monthGanji = "";

            if (apiResult.success) {
                statusEl.innerText = "천문연구원 정밀 연동됨";
                statusEl.className = "text-xs px-2 py-1 rounded bg-green-100 text-green-800 font-bold";
                
                yearGanji = apiResult.ganjiYear;
                monthGanji = apiResult.ganjiMonth;
                dayGanji = apiResult.ganjiDay;
            } else {
                statusEl.innerText = "자체 알고리즘 연산됨";
                statusEl.className = "text-xs px-2 py-1 rounded bg-amber-100 text-amber-800";
                
                const baseDate = new Date(1900, 0, 31);
                const targetDate = new Date(user.year, user.month - 1, user.day);
                const diffDays = Math.floor((targetDate - baseDate) / (1000 * 60 * 60 * 24));
                const dayIndex = ((diffDays % 60) + 60) % 60;
                
                dayGanji = CHEANGAN_HANJA[dayIndex % 10] + JIJI_HANJA[dayIndex % 12];
                yearGanji = CHEANGAN_HANJA[(user.year - 4) % 10] + JIJI_HANJA[(user.year - 4) % 12];
                monthGanji = CHEANGAN_HANJA[user.month % 10] + JIJI_HANJA[user.month % 12];
            }

            document.getElementById('yearPillar').innerText = yearGanji;
            document.getElementById('monthPillar').innerText = monthGanji;
            document.getElementById('dayPillar').innerText = dayGanji;

            if (user.timeUnknown) {
                document.getElementById('hourPillar').innerText = "??";
                document.getElementById('hourPillar').className = "text-2xl md:text-3xl font-bold py-2 opacity-30";
            } else {
                const hourIndex = Math.floor((user.hour + 1) / 2) % 12;
                document.getElementById('hourPillar').innerText = CHEANGAN_HANJA[hourIndex % 10] + JIJI_HANJA[hourIndex];
                document.getElementById('hourPillar').className = "text-2xl md:text-3xl font-bold py-2";
            }

            renderCards(user, dayGanji);
        }

        function renderCards(user, dayGanji) {
            const dayCheanganHanja = dayGanji.charAt(0);
            const dayGanInfo = GANJI_MAP[dayCheanganHanja] || { name: "일간", desc: "당신의 고유한 기운" };

            const container = document.getElementById('analysisCards');
            container.innerHTML = `
                <div class="p-5 bg-white/80 rounded-lg border border-amber-200 shadow-sm">
                    <h3 class="font-bold text-amber-950 text-base mb-2 flex items-center gap-2">
                        <span>👤</span> 타고난 성품과 본질 (${dayCheanganHanja} (${dayGanInfo.name}) <button onclick="openModal('일간')" class="term-btn">일간</button>)
                    </h3>
                    <p class="text-sm leading-relaxed text-gray-800">
                        ${user.name} 님은 <strong>${dayCheanganHanja}(${dayGanInfo.name})</strong>의 기운을 타고났습니다. ${dayGanInfo.desc}. 
                        주변 환경 변화에 쉽게 흔들리지 않고 중심을 지키는 힘이 크며, <button onclick="openModal('십신')" class="term-btn">십신</button>의 오행적 작용에 따라 강한 책임감과 신뢰를 선사합니다.
                    </p>
                </div>

                <div class="p-5 bg-white/80 rounded-lg border border-amber-200 shadow-sm">
                    <h3 class="font-bold text-amber-950 text-base mb-2 flex items-center gap-2">
                        <span>❖</span> 오행의 기운과 핵심 강점
                    </h3>
                    <p class="text-sm leading-relaxed text-gray-800">
                        원국 사주에서 가장 활성화된 에너지와 부족한 기운을 다듬어주는 <button onclick="openModal('용신')" class="term-btn">용신</button>의 관계가 긍정적으로 형성되어 있습니다. 
                        자신의 본질적 장점을 살리고 일상에서 균형감을 찾으신다면 직업적 성공과 재물적 안정감이 극대화됩니다.
                    </p>
                </div>
            `;

            // 오늘의 운세
            const today = new Date();
            document.getElementById('todayDateStr').innerText = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 기준 일진 운세`;

            document.getElementById('todayFortuneCards').innerHTML = `
                <div class="p-4 bg-white/80 rounded-lg border border-amber-200">
                    <div class="text-xs font-bold text-amber-900 border-b border-amber-100 pb-1 mb-2">✨ 총운</div>
                    <div class="text-sm text-gray-700">차분하고 묵직하게 계획을 점검하기에 유리한 하루입니다. 성급한 결정보다는 주위의 조언을 경청해보세요.</div>
                </div>
                <div class="p-4 bg-white/80 rounded-lg border border-amber-200">
                    <div class="text-xs font-bold text-amber-900 border-b border-amber-100 pb-1 mb-2">💰 재물 및 관계운</div>
                    <div class="text-sm text-gray-700">안정적인 흐름입니다. 평소 고마웠던 사람들과 가벼운 안부를 나누며 관계의 대운을 넓히기 좋습니다.</div>
                </div>
            `;
        }

        function openModal(term) {
            document.getElementById('modalTitle').innerText = term;
            document.getElementById('modalBody').innerText = TERMS[term] || "설명 정보가 없습니다.";
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        function resetData() {
            localStorage.removeItem('saju_user_profile');
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('result-container').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('saju_user_profile');
            if (saved) {
                const userData = JSON.parse(saved);
                document.getElementById('input-section').classList.add('hidden');
                document.getElementById('result-container').classList.remove('hidden');
                renderSajuResult(userData);
            }
        });
    </script>
</body>
</html>
